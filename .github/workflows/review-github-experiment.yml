name: Review GitHub experiment
on:
  pull_request:
    types: [reopened, synchronize, ready_for_review]
permissions: {}
concurrency:
  group: review-github-experiment-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  test:
    if: ${{ github.event.action == 'ready_for_review' && github.event.pull_request.number == 58 && github.event.pull_request.user.login == 'ignateff' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'experiment/budget-actions-visibility' && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      pull-requests: write
      actions: read
      checks: read
      statuses: read
    steps:
      - name: Checkout explicitly trusted experiment
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install project tooling
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5
        with:
          version: 2026.10.23
      - name: Start review time budget
        id: clock
        run: echo "started=$(date +%s)000" >> "$GITHUB_OUTPUT"
      - name: Verify PR comment permissions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          comment_id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/issues/58/comments" -f 'body=<!-- temporary-review-permission-probe -->' --jq '.id')
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id"
      - name: Run independent reviewer
        id: review
        run: mise run opencode:budget review
        env:
          GH_TOKEN: ${{ github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENCODE_REVIEW_STARTED_AT: ${{ steps.clock.outputs.started }}
      - name: Prepare saved report
        if: ${{ !cancelled() && steps.review.outputs.report == 'true' }}
        run: |
          mkdir -p "$RUNNER_TEMP/opencode-review-publication"
          cp "$RUNNER_TEMP/opencode-review-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/review.json" "$RUNNER_TEMP/opencode-review-publication/review.json"
      - name: Publish review without model
        if: ${{ !cancelled() && steps.review.outputs.report == 'true' }}
        run: mise run opencode:review-publish
        env:
          GH_TOKEN: ${{ github.token }}
          OPENCODE_PR_NUMBER: ${{ steps.review.outputs.number }}
          OPENCODE_HEAD_SHA: ${{ steps.review.outputs.sha }}
          OPENCODE_REVIEW_ARTIFACT: review-${{ github.run_id }}-${{ github.run_attempt }}
  model-probe:
    if: ${{ github.event.action == 'synchronize' && github.event.pull_request.number == 58 && github.event.pull_request.user.login == 'ignateff' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'experiment/budget-actions-visibility' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout explicitly trusted experiment
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install project tooling
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5
        with:
          version: 2026.10.23
      - name: Probe reviewer with minimal context
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import { installRuntime } from './scripts/opencode-install.ts';
          import { reviewSnapshot } from './scripts/opencode-review.ts';
          const binary = await installRuntime({ directory: `${process.env.RUNNER_TEMP}/review-probe` });
          const context = {
            requirements: { availability: 'available', text: 'An occupied slot must not be offered for booking.' },
            agreement: null,
            baseSha: 'a'.repeat(40), headSha: 'b'.repeat(40),
            changes: [{ filename: 'example.ts', patch: '- return !booked;\n+ return true;' }],
            ci: { status: 'not run' }, previousReview: [], isRelease: false,
          };
          const result = await reviewSnapshot({ binary, context, apiKey: process.env.DEEPSEEK_API_KEY });
          console.log(JSON.stringify(result));
          NODE
