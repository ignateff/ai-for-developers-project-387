name: OpenCode handler diagnostic

on:
  workflow_dispatch:

permissions: {}

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout trusted diagnostic code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install project tooling
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5
        with:
          version: 2026.10.23
      - name: Run bounded handler diagnostic
        timeout-minutes: 6
        # Intentionally does not use the shared repository model variable: the
        # diagnostic pins a separate model and must not depend on production
        # provider credentials.
        run: mise run opencode:github-diagnostic
        env:
          GITHUB_TOKEN: ${{ github.token }}
