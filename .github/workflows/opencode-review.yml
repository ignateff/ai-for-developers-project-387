name: Автоматическое ревью OpenCode

# Reviews cancel at job scope; publication retries must not cancel another review.
# jactionlint ignore=concurrency-limits
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  # The model step collects the pinned base/head trees and selected unchanged
  # related code, test and contract files with contents: read. It never checks
  # out or executes PR code; related files are data in a read-only workspace.
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: opencode-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    outputs:
      number: ${{ steps.workflow.outputs.number }}
      sha: ${{ steps.workflow.outputs.sha }}
      artifact: ${{ steps.report.outputs.artifact }}
    permissions:
      contents: read
      issues: read
      pull-requests: write
      # Read CI evidence for the pinned head: workflow runs, check runs and commit statuses.
      actions: read
      checks: read
      statuses: read
    steps:
      - name: Запустить отсчёт бюджета ревью
        id: clock
        run: echo "started=$(date +%s)000" >> "$GITHUB_OUTPUT"
      - name: Получить доверенную ветку по умолчанию
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Установить инструменты проекта
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5
        with:
          version: 2026.10.23
      - name: Проверить права, допустить и выполнить ревью
        id: workflow
        run: mise run opencode:budget review
        env:
          GH_TOKEN: ${{ github.token }}
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL }}
          OPENCODE_REVIEW_APP_IDS: ${{ vars.OPENCODE_REVIEW_APP_IDS }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENCODE_REVIEW_STARTED_AT: ${{ steps.clock.outputs.started }}
      - name: Определить артефакт результата ревью
        id: report
        if: ${{ !cancelled() && steps.workflow.outputs.report == 'true' }}
        run: echo "artifact=review-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Сохранить результат ревью для публикации
        if: ${{ !cancelled() && steps.workflow.outputs.report == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.report.outputs.artifact }}
          path: ${{ runner.temp }}/opencode-review-${{ github.run_id }}-${{ github.run_attempt }}/review.json
          if-no-files-found: error

  publish:
    needs: review
    if: ${{ !cancelled() && needs.review.outputs.artifact != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: write
    steps:
      - name: Получить доверенную ветку по умолчанию
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Установить инструменты проекта
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5
        with:
          version: 2026.10.23
      - name: Получить исходный результат ревью
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.review.outputs.artifact }}
          path: ${{ runner.temp }}/opencode-review-publication
      - name: Опубликовать без модели и бюджета
        run: mise run opencode:review-publish
        env:
          GH_TOKEN: ${{ github.token }}
          OPENCODE_PR_NUMBER: ${{ needs.review.outputs.number }}
          OPENCODE_HEAD_SHA: ${{ needs.review.outputs.sha }}
          OPENCODE_REVIEW_ARTIFACT: ${{ needs.review.outputs.artifact }}
