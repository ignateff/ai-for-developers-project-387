name: opencode-review

# Reviews cancel at job scope; publication retries must not cancel another review.
# jactionlint ignore=concurrency-limits
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    # Explicit human authorization is required before enabling real review runs.
    # jactionlint ignore=constant-condition
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: opencode-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    outputs:
      number: ${{ steps.budget.outputs.number }}
      sha: ${{ steps.budget.outputs.sha }}
      artifact: ${{ steps.report.outputs.artifact }}
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Install project tooling
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5
        with:
          version: 2026.10.23
      - name: Admit PR review in the model job
        id: budget
        run: mise run opencode:budget review
        env:
          GH_TOKEN: ${{ github.token }}
          OPENCODE_REVIEW_APP_IDS: ${{ vars.OPENCODE_REVIEW_APP_IDS }}
      - name: Prepare pinned reviewer without provider credentials
        if: steps.budget.outputs.allowed == 'true'
        run: mise run opencode:review-prepare
      - name: Run reviewer
        if: steps.budget.outputs.allowed == 'true'
        run: mise run opencode:review-run
        env:
          GH_TOKEN: ${{ github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENCODE_PR_NUMBER: ${{ steps.budget.outputs.number }}
          OPENCODE_HEAD_SHA: ${{ steps.budget.outputs.sha }}
      - name: Identify this review result
        id: report
        if: steps.budget.outputs.allowed == 'true'
        run: echo "artifact=review-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Save review result for publication
        if: steps.budget.outputs.allowed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.report.outputs.artifact }}
          path: ${{ runner.temp }}/opencode-review-${{ github.run_id }}-${{ github.run_attempt }}/review.json
          if-no-files-found: error

  publish:
    needs: review
    if: needs.review.outputs.artifact != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Install project tooling
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5
        with:
          version: 2026.10.23
      - name: Retrieve the original review result
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.review.outputs.artifact }}
          path: ${{ runner.temp }}/opencode-review-publication
      - name: Publish without model or budget
        run: mise run opencode:review-publish
        env:
          GH_TOKEN: ${{ github.token }}
          OPENCODE_PR_NUMBER: ${{ needs.review.outputs.number }}
          OPENCODE_HEAD_SHA: ${{ needs.review.outputs.sha }}
          OPENCODE_REVIEW_ARTIFACT: ${{ needs.review.outputs.artifact }}
