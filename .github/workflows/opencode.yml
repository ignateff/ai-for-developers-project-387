name: Opencode

# Classification runs outside the command queue; only matching jobs are serialized.
# jactionlint ignore=concurrency-limits
on:
  # Only trusted commenters and same-repository PRs pass the preflight below.
  # Executing trusted project checks is intentional; fork code is rejected.
  # jactionlint ignore=dangerous-triggers
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    outputs:
      command: ${{ steps.match.outputs.command }}
    steps:
      - name: Classify comment without credentials
        id: match
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          node <<'NODE'
          const { appendFileSync } = require('node:fs');
          const command = /(?:^|\s)\/(?:oc|opencode)(?=\s|$)/.test(process.env.COMMENT_BODY || '');
          appendFileSync(process.env.GITHUB_OUTPUT, `command=${command}\n`);
          NODE

  opencode:
    name: opencode-command-v2-pr-${{ github.event.issue.number || github.event.pull_request.number }}
    needs: classify
    if: needs.classify.outputs.command == 'true'
    runs-on: ubuntu-latest
    # 45 minutes of agent work + preparation, signal delivery, safe log summary
    # and failure classification. The inner wrapper stops the agent at 45m, the
    # command step at 50m is a second guard, and this job limit leaves the rest.
    timeout-minutes: 55
    outputs:
      sha: ${{ steps.admission.outputs.sha }}
      reason: ${{ steps.outcome.outputs.reason }}
    concurrency:
      group: opencode-command-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
      queue: max
    permissions:
      id-token: write
      actions: read
      contents: read
      pull-requests: read
      # The agent publishes approved specifications and tickets via gh.
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Install project tooling
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5
        with:
          version: 2026.10.23

      - name: Authorize and check Actions history
        id: admission
        run: mise run opencode:actions-budget
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Record command admission v2
        if: steps.admission.outputs.status == 'allowed'
        run: echo "Command admitted"

      - name: Prepare command
        id: prepare
        if: steps.admission.outputs.status == 'allowed'
        timeout-minutes: 6
        continue-on-error: true
        run: mise run opencode:prepare
        env:
          GH_TOKEN: ${{ github.token }}
          OPENCODE_COMMAND_DIR: ${{ runner.temp }}/oc-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Run admitted command
        id: command
        if: steps.admission.outputs.status == 'allowed' && steps.prepare.outcome == 'success'
        timeout-minutes: 50
        continue-on-error: true
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "reason=infra" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          set +e
          timeout --signal=TERM --kill-after=10s 45m mise run opencode:run
          result=$?
          set -e
          if [ "$result" -eq 124 ]; then
            echo "reason=timeout" >> "$GITHUB_OUTPUT"
          elif [ "$result" -eq 137 ]; then
            echo "reason=unknown" >> "$GITHUB_OUTPUT"
          else
            echo "reason=agent_failed" >> "$GITHUB_OUTPUT"
          fi
          exit "$result"
        env:
          GH_TOKEN: ${{ github.token }}
          OPENCODE_COMMAND_DIR: ${{ runner.temp }}/oc-${{ github.run_id }}-${{ github.run_attempt }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Summarize runtime log safely
        if: ${{ !cancelled() && steps.admission.outputs.status == 'allowed' && steps.prepare.outcome == 'success' }}
        timeout-minutes: 2
        continue-on-error: true
        run: mise run opencode:log-summary
        env:
          OPENCODE_COMMAND_DIR: ${{ runner.temp }}/oc-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Classify command outcome
        id: outcome
        # Issue commands have no admission PR, so failures on issues must be
        # classified too. Untrusted/skipped admissions stay silent (no notification
        # for an unauthorized commenter); PR admission failures keep the old path.
        if: ${{ !cancelled() && (steps.admission.outputs.status == 'limit_exhausted' || (steps.admission.outputs.status == 'allowed' && (steps.prepare.outcome == 'failure' || steps.command.outcome == 'failure')) || (steps.admission.outputs.status == 'infra' && steps.admission.outputs.pr != '')) }}
        env:
          ADMISSION: ${{ steps.admission.outputs.status }}
          PREPARE: ${{ steps.prepare.outcome }}
          COMMAND_REASON: ${{ steps.command.outputs.reason }}
        run: |
          reason=infra
          if [ "$ADMISSION" = limit_exhausted ]; then
            reason=limit_exhausted
          elif [ "$ADMISSION" = allowed ] && [ "$PREPARE" != failure ] && [ -n "$COMMAND_REASON" ]; then
            reason=$COMMAND_REASON
          fi
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

      - name: Fail for command errors
        if: ${{ !cancelled() && (steps.prepare.outcome == 'failure' || steps.command.outcome == 'failure') }}
        run: exit 1

  report:
    needs: opencode
    if: ${{ !cancelled() && needs.opencode.outputs.reason != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Comment on the source issue or pull request without model credentials.
      issues: write
      pull-requests: write
    steps:
      - name: Report command outcome
        env:
          GH_TOKEN: ${{ github.token }}
          # The triggering issue or PR number, available even when the agent was
          # never reached; admission.pr is empty for ordinary issue commands.
          TARGET_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          PR_SHA: ${{ needs.opencode.outputs.sha }}
          REASON: ${{ needs.opencode.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          : "${TARGET_NUMBER:?missing source issue or pull request number}"
          sha=${PR_SHA:-unknown}
          case "$REASON" in
            timeout) explanation="the agent hit the 45-minute work limit before publishing a verified result" ;;
            limit_exhausted) explanation="the attempt budget for this issue or pull request is exhausted" ;;
            infra) explanation="the workflow could not start the agent (infrastructure or preparation failure)" ;;
            agent_failed) explanation="the agent failed before publishing a verified result" ;;
            *) explanation="unknown cause" ;;
          esac
          body=$(printf '**OpenCode command failed. Task completion is NOT confirmed.**\n\nThe command did not finish successfully, so there is no verified result.\n\nReason: %s - %s\nSHA: %s\nActions run: %s\n' "$REASON" "$explanation" "$sha" "$RUN_URL")
          comment_id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$TARGET_NUMBER/comments" -f "body=$body" --jq .id)
          if [ -z "$comment_id" ] || [ "$comment_id" = "null" ]; then
            echo "Failed to publish the failure comment: no comment id was returned." >&2
            exit 1
          fi
          echo "Published failure comment $comment_id for reason $REASON on issue or PR $TARGET_NUMBER."
