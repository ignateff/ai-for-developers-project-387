name: opencode

on:
  # Only trusted commenters and same-repository PRs pass the preflight below.
  # Executing trusted project checks is intentional; fork code is rejected.
  # jactionlint ignore=dangerous-triggers
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: opencode-command-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
      queue: max
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Install project tooling
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5
        with:
          version: 2026.10.23

      - name: Authorize original commenter and reject fork PRs
        id: trust
        run: mise run opencode:trust
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Prepare pinned noninteractive runtime without provider credentials
        if: steps.trust.outputs.allowed == 'true'
        run: mise run opencode:prepare
        env:
          OPENCODE_COMMAND_DIR: ${{ runner.temp }}/oc-${{ github.run_id }}-${{ github.run_attempt }}
          GH_TOKEN: ${{ github.token }}

      - name: Run upstream GitHub handler
        if: steps.trust.outputs.allowed == 'true'
        run: mise run opencode:run
        env:
          OPENCODE_COMMAND_DIR: ${{ runner.temp }}/oc-${{ github.run_id }}-${{ github.run_attempt }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ github.token }}
