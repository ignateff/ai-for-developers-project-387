name: Opencode

# Classification runs outside the command queue; only matching jobs are serialized.
# jactionlint ignore=concurrency-limits
on:
  # Only trusted commenters and same-repository PRs pass the preflight below.
  # Executing trusted project checks is intentional; fork code is rejected.
  # jactionlint ignore=dangerous-triggers
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    outputs:
      command: ${{ steps.match.outputs.command }}
    steps:
      - name: Classify comment without credentials
        id: match
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          node <<'NODE'
          const { appendFileSync } = require('node:fs');
          const command = /(?:^|\s)\/(?:oc|opencode)(?=\s|$)/.test(process.env.COMMENT_BODY || '');
          appendFileSync(process.env.GITHUB_OUTPUT, `command=${command}\n`);
          NODE

  opencode:
    name: opencode-command-v2-pr-${{ github.event.issue.number || github.event.pull_request.number }}
    needs: classify
    if: needs.classify.outputs.command == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      pr: ${{ steps.admission.outputs.pr }}
      sha: ${{ steps.admission.outputs.sha }}
      reason: ${{ steps.outcome.outputs.reason }}
    concurrency:
      group: opencode-command-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
      queue: max
    permissions:
      id-token: write
      actions: read
      contents: read
      pull-requests: read
      # The agent publishes approved specifications and tickets via gh.
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Install project tooling
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5
        with:
          version: 2026.10.23

      - name: Authorize and check Actions history
        id: admission
        run: mise run opencode:actions-budget
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Record command admission v2
        if: steps.admission.outputs.status == 'allowed'
        run: echo "Command admitted"

      - name: Prepare command
        id: prepare
        if: steps.admission.outputs.status == 'allowed'
        continue-on-error: true
        run: mise run opencode:prepare
        env:
          GH_TOKEN: ${{ github.token }}
          OPENCODE_COMMAND_DIR: ${{ runner.temp }}/oc-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Run admitted command
        id: command
        if: steps.admission.outputs.status == 'allowed' && steps.prepare.outcome == 'success'
        timeout-minutes: 22
        continue-on-error: true
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "reason=infra" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          set +e
          timeout --signal=TERM --kill-after=10s 19m mise run opencode:run
          result=$?
          set -e
          if [ "$result" -eq 124 ]; then
            echo "reason=timeout" >> "$GITHUB_OUTPUT"
          elif [ "$result" -eq 137 ]; then
            echo "reason=unknown" >> "$GITHUB_OUTPUT"
          else
            echo "reason=agent_failed" >> "$GITHUB_OUTPUT"
          fi
          exit "$result"
        env:
          GH_TOKEN: ${{ github.token }}
          OPENCODE_COMMAND_DIR: ${{ runner.temp }}/oc-${{ github.run_id }}-${{ github.run_attempt }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Summarize runtime log safely
        if: ${{ !cancelled() && steps.admission.outputs.status == 'allowed' && steps.prepare.outcome == 'success' }}
        continue-on-error: true
        run: mise run opencode:log-summary
        env:
          OPENCODE_COMMAND_DIR: ${{ runner.temp }}/oc-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Classify command outcome
        id: outcome
        if: ${{ !cancelled() && steps.admission.outputs.pr != '' && (steps.admission.outputs.status == 'limit_exhausted' || steps.admission.outputs.status == 'infra' || steps.prepare.outcome == 'failure' || steps.command.outcome == 'failure') }}
        env:
          ADMISSION: ${{ steps.admission.outputs.status }}
          PREPARE: ${{ steps.prepare.outcome }}
          COMMAND_REASON: ${{ steps.command.outputs.reason }}
        run: |
          reason=${COMMAND_REASON:-infra}
          if [ "$ADMISSION" = limit_exhausted ]; then reason=limit_exhausted; fi
          if [ "$ADMISSION" = infra ] || [ "$PREPARE" = failure ]; then reason=infra; fi
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

      - name: Fail for command errors
        if: ${{ !cancelled() && (steps.prepare.outcome == 'failure' || steps.command.outcome == 'failure') }}
        run: exit 1

  report:
    needs: opencode
    if: ${{ !cancelled() && needs.opencode.outputs.pr != '' && needs.opencode.outputs.reason != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: read
      pull-requests: write
    steps:
      - name: Report command outcome
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.opencode.outputs.pr }}
          PR_SHA: ${{ needs.opencode.outputs.sha }}
          REASON: ${{ needs.opencode.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f "body=OpenCode: $REASON. Нужен человек. SHA: $PR_SHA. Логи: $RUN_URL"
