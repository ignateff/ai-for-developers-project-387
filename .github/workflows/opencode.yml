name: opencode

# Classification runs outside the command queue; only matching jobs are serialized.
# jactionlint ignore=concurrency-limits
on:
  # Only trusted commenters and same-repository PRs pass the preflight below.
  # Executing trusted project checks is intentional; fork code is rejected.
  # jactionlint ignore=dangerous-triggers
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    outputs:
      command: ${{ steps.match.outputs.command }}
    steps:
      - name: Classify comment without credentials
        id: match
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          node <<'NODE'
          const { appendFileSync } = require('node:fs');
          const command = /(?:^|\s)\/(?:oc|opencode)(?=\s|$)/.test(process.env.COMMENT_BODY || '');
          appendFileSync(process.env.GITHUB_OUTPUT, `command=${command}\n`);
          NODE

  opencode:
    needs: classify
    if: needs.classify.outputs.command == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: opencode-command-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
      queue: max
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      # The agent publishes approved specifications and tickets via gh.
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Install project tooling
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5
        with:
          version: 2026.10.23

      - name: Authorize, admit and run the command
        run: mise run opencode:budget command
        env:
          GH_TOKEN: ${{ github.token }}
          OPENCODE_COMMAND_DIR: ${{ runner.temp }}/oc-${{ github.run_id }}-${{ github.run_attempt }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
