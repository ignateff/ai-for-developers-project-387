name: OpenCode upstream experiment

# Temporary comparison with the upstream GitHub Action; see issue #90.
# jactionlint ignore=concurrency-limits
on:
  # The trust preflight rejects untrusted commenters and fork PRs.
  # jactionlint ignore=dangerous-triggers
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

jobs:
  experiment:
    if: >-
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: opencode-upstream-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
      queue: max
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Install project tooling
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5
        with:
          version: 2026.10.23
      - name: Check original author and repository
        id: trust
        run: mise run opencode:trust
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Run upstream OpenCode
        if: steps.trust.outputs.allowed == 'true'
        uses: anomalyco/opencode/github@810c0eba1a7348036f8bdf61e6632d0c36c6876c # source for v1.19.5; installer selects latest CLI
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        with:
          model: deepseek/deepseek-flash
