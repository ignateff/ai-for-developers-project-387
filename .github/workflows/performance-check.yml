name: Проверка производительности

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: URL приложения для аудита (по умолчанию APP_URL или развёрнутое приложение)
        required: false
        type: string

permissions: {}

jobs:
  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Установить Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.22.2"

      - name: Запустить Lighthouse
        env:
          APP_URL: ${{ inputs.app_url || vars.APP_URL || 'https://call-calendar-k7f2.fly.dev' }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "Укажите параметр app_url или переменную репозитория APP_URL." >&2
            exit 1
          fi
          mkdir -p .audit
          npx --yes lighthouse@13.6.0 "$APP_URL" \
            --output=json \
            --output-path=.audit/lighthouse-report.json \
            --chrome-flags="--headless"

      - name: Сохранить отчёт
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lighthouse-report
          path: .audit/lighthouse-report.json
          include-hidden-files: true
          if-no-files-found: error

      - name: Установить инструменты проекта
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5
        with:
          version: 2026.10.23

      - name: Установить OpenCode
        id: opencode
        shell: bash
        run: |
          executable=$(mise run opencode:install "$RUNNER_TEMP/opencode" | tail -n 1)
          test -x "$executable"
          echo "executable=$executable" >> "$GITHUB_OUTPUT"

      - name: Проанализировать с помощью OpenCode
        env:
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          OPENCODE_EXECUTABLE: ${{ steps.opencode.outputs.executable }}
        run: |
          node scripts/opencode-launch.ts "$OPENCODE_EXECUTABLE" run "$(cat <<'PROMPT'
            Read .audit/lighthouse-report.json.
            Compare available LCP and CLS measurements with the targets in
            docs/performance-baseline.md. Lighthouse lab runs do not measure INP;
            report it as unavailable, not as a regression.
            For metrics that degraded by more than 10%,
            identify likely culprits in recent commits and
            search open and closed issues for the same finding, then create a
            task only for a new finding.
            Include the evidence, proposed action and a link to this run.
            Existing findings and summaries may already be published in English:
            reuse those issues and comments instead of creating Russian
            duplicates. Add a comment only when the evidence or result changed,
            and never repeat an unchanged comment. Do not commit the report.
            Write every user-facing issue title, issue body, comment and summary in Russian.
            Keep metric names (LCP, CLS, INP), identifiers, paths, URLs and code unchanged.
          PROMPT
          )"
