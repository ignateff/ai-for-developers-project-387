name: Performance Check

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: Application URL to audit (defaults to APP_URL or the deployed application)
        required: false
        type: string

permissions: {}

jobs:
  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.22.2"

      - name: Run Lighthouse
        env:
          APP_URL: ${{ inputs.app_url || vars.APP_URL || 'https://call-calendar-k7f2.fly.dev' }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "Set the app_url input or the APP_URL repository variable." >&2
            exit 1
          fi
          mkdir -p .audit
          npx --yes lighthouse@13.6.0 "$APP_URL" \
            --output=json \
            --output-path=.audit/lighthouse-report.json \
            --chrome-flags="--headless"

      - name: Save report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lighthouse-report
          path: .audit/lighthouse-report.json
          include-hidden-files: true
          if-no-files-found: error

      - name: Install project tooling
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5
        with:
          version: 2026.10.23

      - name: Install OpenCode
        id: opencode
        shell: bash
        run: |
          executable=$(mise run opencode:install "$RUNNER_TEMP/opencode" | tail -n 1)
          test -x "$executable"
          echo "executable=$executable" >> "$GITHUB_OUTPUT"

      - name: Analyze with OpenCode
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          OPENCODE_EXECUTABLE: ${{ steps.opencode.outputs.executable }}
        run: |
          "$OPENCODE_EXECUTABLE" run --model deepseek/deepseek-flash "$(cat <<'PROMPT'
            Read .audit/lighthouse-report.json.
            Compare available LCP and CLS measurements with the targets in
            docs/performance-baseline.md. Lighthouse lab runs do not measure INP;
            report it as unavailable, not as a regression.
            For metrics that degraded by more than 10%,
            identify likely culprits in recent commits and
            search existing issues, then create a task only for a new finding.
            Include the evidence, proposed action and a link to this run.
            Do not repeat unchanged comments or commit the report.
          PROMPT
          )"
